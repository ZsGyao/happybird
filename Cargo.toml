[package]
name = "happybird"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.22"
anyhow = "1.0"
directories = "6"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
notify = "8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2.5"
urlencoding = "2"
smallvec = { version = "1.6", features = ["union"] }
rand = "0.9.2"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
csv = "1.3"
calamine = "0.25"
pinyin = "0.10"
rust_xlsxwriter = "0.64"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time", "registry", "std", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"

[dev-dependencies]
tempfile = "3.20.0"

[build-dependencies]
winres = "0.1"
