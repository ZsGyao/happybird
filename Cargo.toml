[package]
name = "happybird"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
directories = "6"
gpui = "0.2.2"
gpui-component = "0.5.0"
# Optional, for default bundled assets
gpui-component-assets = "0.5.0"
rust-embed = "8"
sqlx = { version = "0.8", features = ["chrono", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2"
