[package]
name = "happybird"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.22"
anyhow = "1.0"
directories = "6"
gpui = "0.2.2"
gpui-component = "0.5.0"
# Optional, for default bundled assets
gpui-component-assets = "0.5.0"
notify = "8"
rust-embed = "8"
sqlx = { version = "0.8", features = ["chrono", "runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2.5"
urlencoding = "2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }

[dev-dependencies]
tempfile = "3.20.0"
